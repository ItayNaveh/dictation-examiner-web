<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Examiner</title>
		<style>
			body {
				padding-top: 2ch;
				padding-left: 2ch;
			}

			pre {
				font-family: "Lucida Console", monospace;
				height: 90vh;
				overflow-y: auto;
				margin-bottom: 0;
			}
		</style>
	</head>
	<body>
		<button id="startbtn">Start</button>
		<form id="cmdlineform" hidden>
			<input name="cmdline" type="text" />
		</form>
		<pre id="stdout"></pre>

		<script type="module">
			import * as player from "./player.js";
			import * as examiner from "./examiner.js";

			let examiner_state = {};

			startbtn.addEventListener("click", async () => {
				startbtn.hidden = true;
				await player.init();

				stdout.innerHTML += examiner.init(examiner_state);
				cmdlineform.hidden = false;
			});

			cmdlineform.addEventListener("submit", ev => {
				ev.preventDefault();
				const line = ev.target.children[0].value;

				stdout.innerHTML += "&gt; " + line + "<br/>";
				ev.target.children[0].value = "";
				examiner.handleLine(examiner_state, line).then(output => {
					if (output == "$RESET") {
						examiner_state = {};
						stdout.innerHTML = examiner.init(examiner_state);
						return;
					}

					stdout.innerHTML += output;
				});
			});
		</script>
	</body>
</html>
