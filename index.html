<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Examiner</title>
		<style>
			body {
				padding-top: 2ch;
				padding-left: 2ch;
				font-family: "Segoe UI", sans-serif;
				font-size: 20px;
			}

			#answerstuff__form__inner {
				display: flex;
				align-items: center;
			}
		</style>
	</head>
	<body>
		<div id="presetstuff">
			<div id="presetstuff__sel"></div>
			<button id="presetstuff__next">Next</button>
		</div>

		<div id="answerstuff" hidden>
			<button id="answerstuff__again">Again</button>
			<button id="answerstuff__finish">Finish Early</button>
			<form id="answerstuff__form">
				<div id="answerstuff__form__inner"></div>
				<button type="submit">Next</button>
			</form>
		</div>

		<div id="summarystuff" hidden>
			<div id="summarystuff__log"></div>
			<button id="summarystuff__reset">Reset</button>
		</div>

		<script type="module">
			import * as player from "./player.js";
			import * as examiner from "./examiner.js";

			let player_inited = false;
			let examiner_state = {};
			const question_count = 5;
			let qi = 0;

			let presets_builder = "";
			for (const p of examiner.PRESETS) presets_builder += `<label><input type="radio" name="preset-sel" value="${p}" required />${p}</label><br />`;
			presetstuff__sel.innerHTML = presets_builder;

			presetstuff__next.addEventListener("click", async () => {
				const selected = presetstuff__sel.querySelector("input:checked");
				if (!selected) { console.log("Please select first"); return; }
				presetstuff.hidden = true;
				examiner.init(examiner_state, selected.value);
				
				if (!player_inited) { await player.init(); player_inited = true; }
				await next_question();
				answerstuff.hidden = false;
			});

			async function next_question() {
				if (qi >= question_count) { finish_test(); return; }
				const possible_answers = await examiner.next_question(examiner_state);
				let answers_builder = "";
				let colidx = 0;
				for (const col of possible_answers) {
					answers_builder += `<div class="answerstuff__form__inner__col">`;
					for (const a of col) answers_builder += `<label><input type="radio" name="col-${colidx}" value="${a}" required />${a}</label><br />`;
					answers_builder += `</div>`;
					colidx++;
				}
				answerstuff__form__inner.innerHTML = answers_builder;
			}

			answerstuff__again.addEventListener("click", () => examiner.replay_question(examiner_state));
			answerstuff__finish.addEventListener("click", () => finish_test());

			answerstuff__form.addEventListener("submit", ev => {
				ev.preventDefault();

				const cols = [...answerstuff__form__inner.querySelectorAll(".answerstuff__form__inner__col input:checked")];
				const answer = cols.map(i => [+i.name.substring("col-".length), i.value]).sort((a, b) => a[0] - b[0]).map(i => i[1]).join(" ");
				examiner.submit_answer(examiner_state, answer);

				qi += 1;
				answerstuff__form__inner.innerHTML = "";
				next_question();
			});

			function finish_test() {
				answerstuff.hidden = true;

				const log = examiner.get_log(examiner_state);
				let summarybuilder = "";
				summarybuilder += `<br/>==========<br/>You got ${log.filter(e => e.is_correct).length} / ${log.length}<br/>==========<br/>`;
				summarybuilder += "You     /     Answer<br />";
				for (let i = 0; i < log.length; i++) {
					const l = log[i];
					const color = l.is_correct ? "green" : "red";
					summarybuilder += `<button class="summarystuff__log__play" data-i="${i}">P</button> ${i + 1}. <span style="color: ${color}">${l.answer}    ${l.question}</span><br/>`;
				}

				summarystuff__log.innerHTML = summarybuilder;
				summarystuff.hidden = false;

				summarystuff__log.querySelectorAll(".summarystuff__log__play").forEach(btn => btn.addEventListener("click", ev => {
					examiner.play_from_log(examiner_state, +ev.target.dataset.i);
				}));
			}

			summarystuff__reset.addEventListener("click", () => {
				summarystuff.hidden = true;

				examiner_state = {};
				qi = 0;
				examiner.init(examiner_state);

				presetstuff.hidden = false;
			});
		</script>
	</body>
</html>
